name: Verify
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci
      - run: npm ci --prefix clients/codex --ignore-scripts
      - run: npm audit --prefix clients/codex --audit-level=moderate
      - run: npm run audit:dependencies
      - run: npm run verify
      - run: npm run test:worker
      - name: Secret scan
        run: |
          curl --fail --silent --show-error --location --output gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl --fail --silent --show-error --location --output checksums.txt https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          awk '$2 == "gitleaks_8.30.1_linux_x64.tar.gz" { print $1 "  gitleaks.tar.gz" }' checksums.txt | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --no-banner
